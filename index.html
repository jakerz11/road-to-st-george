<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Road to UVM">
<meta name="description" content="Floor + Upgrade training tracker for the Utah Valley Marathon, Sat Jun 5 2027.">
<meta name="theme-color" content="#0b2236">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Road to Utah Valley</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* ===== Tokens (light) ===== */
:root{
  color-scheme:light;
  --bg:#f2f4f3;--surface:#ffffff;--surface-2:#f5f7f6;--surface-3:#e9edec;
  --text:#101a20;--text-2:#4b5960;--muted:#79858a;--line:#e1e6e5;--axis:#c3cbc9;
  --brand:#0f4c6e;--brand-2:#14668f;--accent:#2a78d6;--focus:#2a78d6;
  --up:#9a5300;--up-bg:#fff3dd;--up-line:#f2a33a;
  --good:#0ca30c;--good-ink:#006300;--good-bg:#e6f5e6;
  --warn:#fab219;--warn-ink:#7a5000;--warn-bg:#fff5d9;
  --bad:#d03b3b;--bad-ink:#a32020;--bad-bg:#fdeceb;
  /* Phase colours: validated categorical set (adjacent CVD dE >= 13, normal-vision >= 27) */
  --ph-recovery:#e87ba4;--ph-base:#008300;--ph-build:#2a78d6;--ph-peak:#eb6834;--ph-taper:#6250d6;
  --ph-race:#eda100;--ph-stg:#a39e93;
  --ghost:#e3e8e7;--ink-target:#4b5960;--plan-floor:#4b5960;--plan-up:#a3adb1;
  --radius:18px;--radius-sm:12px;
  --shadow:0 1px 2px rgba(16,26,32,.05),0 6px 18px rgba(16,26,32,.06);
  --tabbar-h:62px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
/* ===== Tokens (dark): OS setting, unless the user forced light ===== */
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#0c1114;--surface:#161c20;--surface-2:#1c2429;--surface-3:#243037;
    --text:#eef2f3;--text-2:#b8c3c8;--muted:#8b979d;--line:#263137;--axis:#3a474e;
    --brand:#0e3a55;--brand-2:#4aa3d4;--accent:#3987e5;--focus:#5aa2ef;
    --up:#f7c46c;--up-bg:#3a2a10;--up-line:#f2a33a;
    --good-ink:#4cc94c;--good-bg:#12301a;--warn-ink:#fab219;--warn-bg:#352a0e;--bad-ink:#ff8a8a;--bad-bg:#3d1818;
    --ph-recovery:#d55181;--ph-base:#008300;--ph-build:#3987e5;--ph-peak:#d95926;--ph-taper:#9085e9;
    --ph-race:#c98500;--ph-stg:#6f6b63;
    --ghost:#27323a;--ink-target:#d5dde0;--plan-floor:#b8c3c8;--plan-up:#66737a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1114;--surface:#161c20;--surface-2:#1c2429;--surface-3:#243037;
  --text:#eef2f3;--text-2:#b8c3c8;--muted:#8b979d;--line:#263137;--axis:#3a474e;
  --brand:#0e3a55;--brand-2:#4aa3d4;--accent:#3987e5;--focus:#5aa2ef;
  --up:#f7c46c;--up-bg:#3a2a10;--up-line:#f2a33a;
  --good-ink:#4cc94c;--good-bg:#12301a;--warn-ink:#fab219;--warn-bg:#352a0e;--bad-ink:#ff8a8a;--bad-bg:#3d1818;
  --ph-recovery:#d55181;--ph-base:#008300;--ph-build:#3987e5;--ph-peak:#d95926;--ph-taper:#9085e9;
  --ph-race:#c98500;--ph-stg:#6f6b63;
  --ghost:#27323a;--ink-target:#d5dde0;--plan-floor:#b8c3c8;--plan-up:#66737a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
/* ===== Base ===== */
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabbar-h) + var(--safe-b) + 18px)}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
/* ===== Top bar ===== */
.topbar{position:sticky;top:0;z-index:50;background:#0b2236;background:rgba(11,34,54,.94);color:#fff;
  -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
  padding:calc(var(--safe-t) + 10px) 16px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
.topbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.3px;font-size:1.02rem}
.brand svg{width:30px;height:30px;flex:none;border-radius:9px}
.brand small{display:block;font-size:.68rem;font-weight:700;color:rgba(255,255,255,.68);letter-spacing:.02em}
@media (max-width:360px){.brand{font-size:.9rem}.brand svg{width:26px;height:26px}.topbar .chip{padding:4px 8px}}
.topbar .chip{background:rgba(255,255,255,.14);color:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:.74rem;
  font-weight:800;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.topbar .chip{margin-left:auto}
main{max-width:560px;margin:0 auto;padding:12px 12px 0}
.panel{display:none}
.panel.active{display:block;animation:fade .2s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.page-title{font-size:1.5rem;font-weight:800;letter-spacing:-.6px;margin:6px 4px 12px}
/* ===== Cards ===== */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.card>h3,.card-h{font-size:.98rem;font-weight:800;letter-spacing:-.2px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card-h .chip,.card>h3 .chip{margin-left:auto}
.eyebrow{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sub{font-size:.82rem;color:var(--text-2)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 16px;
  font-weight:800;font-size:.95rem;cursor:pointer;background:var(--surface-3);color:var(--text)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand-2);color:#fff}
.btn.block{width:100%}
.btn.small{padding:7px 12px;font-size:.8rem;border-radius:10px}
.btn.ghost{background:transparent;color:var(--text-2);padding:7px 10px}
.link{border:0;background:none;color:var(--brand-2);font-weight:800;cursor:pointer;font-size:.82rem;padding:4px 0}
/* ===== Hero ===== */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 14px;margin-bottom:12px;color:#fff;
  background:linear-gradient(165deg,#0a2236 0%,#0f4c6e 52%,#1f86b0 100%);box-shadow:0 12px 30px rgba(10,34,54,.28)}
.hero .glow{position:absolute;right:-50px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(247,196,108,.55) 0%,rgba(247,196,108,0) 66%);pointer-events:none}
.hero svg.mtn{position:absolute;left:0;right:0;bottom:0;width:100%;height:110px;pointer-events:none}
.hero>*:not(.glow):not(.mtn){position:relative}
.hero .eyebrow{color:rgba(255,255,255,.78)}
.hero-main{display:flex;align-items:flex-end;gap:12px;margin-top:8px}
.hero-num{font-size:3.6rem;font-weight:800;letter-spacing:-2.5px;line-height:.9}
.hero-lbl{font-size:.95rem;font-weight:700;line-height:1.2;padding-bottom:4px}
.hero-lbl small{display:block;font-weight:600;opacity:.8;font-size:.78rem}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hero .chip{background:rgba(255,255,255,.16);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.phasebar{display:flex;gap:2px;height:8px;margin-top:16px;border-radius:999px;overflow:hidden}
.phasebar span{display:block;height:100%}
.phasebar-wrap{position:relative}
.phasebar-pin{position:absolute;top:-5px;width:4px;height:18px;margin-left:-2px;border-radius:3px;background:#fff;box-shadow:0 0 0 2px rgba(10,34,54,.55)}
.phasebar-lbls{display:flex;gap:2px;margin-top:5px;font-size:.64rem;font-weight:800;color:rgba(255,255,255,.82)}
.phasebar-lbls span{white-space:nowrap}
.phasebar-lbls span:last-child{text-align:right}
/* ===== Alerts / rules ===== */
.rule{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:13px;background:var(--surface-2);
  font-size:.84rem;color:var(--text-2);margin-top:8px;border:1px solid var(--line)}
.rule .ri{font-size:1.05rem;line-height:1.25;flex:none}
.rule b{color:var(--text)}
.rule.warn{background:var(--warn-bg);border-color:transparent;color:var(--text)}
.rule.bad{background:var(--bad-bg);border-color:transparent;color:var(--text)}
.rule.good{background:var(--good-bg);border-color:transparent;color:var(--text)}
.alert{margin-bottom:12px}
.alert .rule{margin-top:0;box-shadow:var(--shadow)}
/* ===== Day nav ===== */
.daynav{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.daynav .arrow{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);
  font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;color:var(--text)}
.daynav .arrow:disabled{opacity:.35}
.daynav .mid{flex:1;text-align:center;min-width:0}
.daynav .d1{font-weight:800;font-size:1.05rem;letter-spacing:-.2px}
.daynav .d2{font-size:.74rem;color:var(--muted);font-weight:700}
.today-pill{display:inline-block;margin-top:5px;border:0;border-radius:999px;padding:4px 12px;font-size:.72rem;font-weight:800;
  background:var(--brand-2);color:#fff;cursor:pointer}
/* ===== Workout card ===== */
.wo{padding-top:21px}
.wo::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--phase,var(--muted))}
.wo-head{display:flex;align-items:flex-start;gap:10px}
.wo-icon{font-size:1.9rem;line-height:1;flex:none;margin-top:2px}
.wo-title{font-size:1.28rem;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:800;letter-spacing:.03em;padding:3px 8px;border-radius:999px;
  background:var(--surface-3);color:var(--text-2)}
.badge.key{background:#fff1c9;color:#6b4a00}
.badge.up{background:var(--up-bg);color:var(--up)}
.badge.phase{background:transparent;border:1.5px solid var(--phase,var(--line));color:var(--text-2)}
:root[data-theme="dark"] .badge.key{background:#3b2f0c;color:#f7d27a}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .badge.key{background:#3b2f0c;color:#f7d27a}}
.seg{display:inline-flex;background:var(--surface-3);border-radius:13px;padding:3px;gap:3px;margin-top:14px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:800;font-size:.85rem;color:var(--text-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.seg-lock{font-size:.75rem;color:var(--text-2);margin-top:4px}
.seg button.upbtn[aria-pressed="true"]{background:linear-gradient(135deg,#f9cf7f,#f2a33a);color:#3b2400}
.seg.wide{display:flex}
.seg.wide button{flex:1}
.wo-dist{display:flex;align-items:baseline;gap:6px;margin-top:14px}
.wo-dist b{font-size:2.7rem;font-weight:800;letter-spacing:-1.6px;line-height:1}
.wo-dist span{font-size:1rem;font-weight:700;color:var(--text-2)}
.wo-desc{font-size:1.02rem;font-weight:700;margin-top:6px}
.wo-notes{font-size:.86rem;color:var(--text-2);margin-top:6px}
.wo-alt{font-size:.8rem;color:var(--muted);margin-top:8px}
.paces{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pace{display:flex;flex-direction:column;gap:1px;padding:7px 10px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);min-width:0}
.pace i{font-style:normal;font-size:.62rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pace b{font-size:.95rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pace s{text-decoration:none;font-size:.66rem;color:var(--muted)}
.strength-line{display:flex;gap:10px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:13px;background:var(--surface-2);font-size:.84rem;color:var(--text-2)}
.strength-line b{color:var(--text)}
/* ===== Log card ===== */
.donebtn{width:100%;padding:15px;border-radius:15px;border:0;font-size:1.05rem;font-weight:800;cursor:pointer;
  background:var(--brand-2);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 16px rgba(20,102,143,.25)}
.donebtn.up{background:linear-gradient(135deg,#f6b951,#e48a14);color:#2b1800;box-shadow:0 6px 16px rgba(228,138,20,.25)}
.logged{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:15px;background:var(--good-bg);color:var(--good-ink);font-weight:800}
.logged .spacer{flex:1}
.logged button{border:0;background:none;color:var(--good-ink);font-weight:800;text-decoration:underline;cursor:pointer;font-size:.8rem}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.field label,.flabel{display:block;font-size:.66rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea,.input{width:100%;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface-2);font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.field textarea{font-weight:500;resize:vertical;min-height:44px}
.field.full{grid-column:1/-1}
.paceout{font-size:.78rem;color:var(--text-2);margin-top:6px;font-weight:600;min-height:1.1em}
.feel{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.feel button{aspect-ratio:1;max-height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);
  font-size:.78rem;font-weight:800;color:var(--muted);cursor:pointer;padding:0}
.feel button[aria-pressed="true"]{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tgl{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--surface);font-weight:800;font-size:.84rem;cursor:pointer;color:var(--text-2)}
.tgl[aria-pressed="true"]{border-color:var(--good);background:var(--good-bg);color:var(--good-ink)}
.tgl.pain[aria-pressed="true"]{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-ink)}
details.more{margin-top:10px}
details.more>summary{cursor:pointer;list-style:none;font-weight:800;font-size:.85rem;color:var(--brand-2);padding:6px 0}
details.more>summary::-webkit-details-marker{display:none}
/* ===== Week card ===== */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:2px 0 12px}
.sd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:12px;background:var(--surface-2);
  border:1.5px solid transparent;cursor:pointer;position:relative;min-height:76px;color:var(--text)}
.sd .dn{font-size:.62rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sd .dd{font-size:.95rem;font-weight:800}
.sd .di{font-size:.95rem;line-height:1.1}
.sd .dm{font-size:.66rem;color:var(--text-2);font-weight:800}
.sd.sel{border-color:var(--text)}
.sd.today .dd{color:var(--accent)}
.sd.done{background:var(--good-bg)}
.sd.done::after{content:"✓";position:absolute;top:2px;right:5px;font-size:.66rem;font-weight:900;color:var(--good-ink)}
.sd.miss::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;border:1.5px solid var(--bad)}
.sd .str{position:absolute;bottom:3px;right:4px;font-size:.55rem}
.wkstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wkstat{background:var(--surface-2);border-radius:12px;padding:9px 10px}
.wkstat .v{font-size:1.15rem;font-weight:800;letter-spacing:-.3px}
.wkstat .v small{font-size:.75rem;color:var(--muted);font-weight:700}
.wkstat .l{font-size:.68rem;color:var(--text-2);font-weight:700}
.meter{position:relative;height:10px;border-radius:999px;background:var(--surface-3);margin:14px 0 6px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent);max-width:100%}
.meter .tick{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;background:var(--ink-target);border-radius:2px}
.meter-lbls{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);font-weight:700}
.status{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:800;padding:4px 10px;border-radius:999px}
.status.hit{background:var(--good-bg);color:var(--good-ink)}
.status.open{background:var(--warn-bg);color:var(--warn-ink)}
.status.miss{background:var(--bad-bg);color:var(--bad-ink)}
.status.future{background:var(--surface-3);color:var(--text-2)}
.streaks{display:flex;gap:8px;margin-top:12px}
.streak{flex:1;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:13px;background:var(--surface-2)}
.streak .sv{font-size:1.4rem;font-weight:800;line-height:1}
.streak .sl{font-size:.72rem;color:var(--text-2);font-weight:700;line-height:1.25}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--surface-3);display:block}
.dots i.on{background:var(--good)}
/* ===== Lists ===== */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .lic{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex:none}
.li .lim{flex:1;min-width:0}
.li .lt{font-weight:800;font-size:.9rem}
.li .ls{font-size:.76rem;color:var(--text-2)}
.li .lr{font-size:.76rem;font-weight:800;color:var(--text-2);text-align:right;white-space:nowrap}
.li.btnlike{cursor:pointer}
.quote{text-align:center;padding:20px 18px;font-size:.92rem;line-height:1.5;color:var(--text-2);font-style:italic}
.quote b{display:block;font-style:normal;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}
/* ===== Calendar ===== */
.calnav{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}
.calnav h2{font-size:1.2rem;font-weight:800;letter-spacing:-.4px}
.calnav button{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;color:var(--text)}
.calnav button:disabled{opacity:.35}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calhd{text-align:center;font-size:.64rem;font-weight:800;color:var(--muted);padding:4px 0;letter-spacing:.05em;text-transform:uppercase}
.cc{position:relative;min-height:58px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:5px 2px 4px;cursor:pointer;background:var(--surface);border:1.5px solid transparent;color:var(--text);overflow:hidden}
.cc::before{content:"";position:absolute;inset:0;background:var(--tint,transparent);opacity:.13;pointer-events:none}

function syncOn() { return !!syncCfg().passcode; }
function syncable(k) { return /^e:\d{4}-\d{2}-\d{2}$/.test(k) || k === 'k:settings' || (k.startsWith('k:checkpoint:') && !!CP[k.slice(13)]); }
function itemOf(k) {

}
function syncKeys() {
  return Object.keys(DB.entries).map(iso => `e:${iso}`)
    .concat(Object.keys(DB.checkpoints).filter(id => CP[id]).map(id => `k:checkpoint:${id}`), ['k:settings']);
}
function itemSig(v) { return JSON.stringify(v, Object.keys(v).sort()); } // a function declaration: used at load, before this line runs

function initSyncState(db) {

// Runs on every save: whatever differs from the snapshot was just edited (or deleted) on this device.

// Apply one cloud row to the local log. Returns true if the local log changed.
function applyRow(k, r) {

    else delete DB.checkpoints[id];

// Pull (sent = null): take each cloud row unless this device's copy is newer, in which case that copy is queued for

// cloud's row for each item unless it was edited here again while the request was out.
function mergeRows(res, sent) {
  const S = DB.sync; let n = 0;
  const rows = (res.entries || []).map(r => [`e:${r.day}`, r]).concat((res.kv || []).map(r => [`k:${r.key}`, r]));
  for (const [k, r] of rows) {
    if (!syncable(k)) continue;
    const R = +r.updated_at || 0;
    if (sent) { if (!(k in sent) || S.u[k] !== sent[k]) continue; }
    else if (S.u[k] !== undefined && R < S.u[k]) { S.pend[k] = 1; continue; }
    if (applyRow(k, r)) n++;

  for (const k of syncKeys()) {
    if (have.has(k) || (k === 'k:settings' && !S.u[k] && (DB.settings.track || 'auto') === 'auto')) continue;
    if (S.u[k] === undefined) S.u[k] = 0;

}
async function syncFetch(method, query, body) {
  const cfg = syncCfg(), ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), 20000) : 0;
  let r, j = null;
  try {
    r = await fetch((cfg.api || SYNC_API) + query, { method, cache: 'no-store', signal: ctl ? ctl.signal : undefined,
      headers: Object.assign({ 'X-Sync-Passcode': cfg.passcode }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined });
    j = await r.json().catch(() => null);
  } catch (err) { throw Object.assign(new Error('offline'), { offline: true }); }
  finally { clearTimeout(timer); }
  if (!r.ok || !j || !j.ok) {
    throw Object.assign(new Error((j && (j.detail || j.error)) || `server answered ${r.status}`), { auth: r.status === 401 && !!j && j.error === 'unauthorized' });

}
function syncSoon(ms) {

}
// Pull what changed in the cloud (everything when full), merge, then push this device's newer copies.
async function syncNow(opts) {
  if (!syncOn()) return false;
  if (SYNC.busy) { SYNC.again = true; return false; }
  clearTimeout(SYNC.timer);
  SYNC.busy = true; SYNC.state = 'syncing'; syncUI();
  let changed = 0;
  try {
    stampChanges();
    const S = DB.sync, full = !!(opts && opts.full) || !S.since;
    if (!S.at && lsGet(`${STORE_KEY}:presync`) === null) lsSet(`${STORE_KEY}:presync`, JSON.stringify(DB)); // one-time safety copy
    const pull = await syncFetch('GET', full ? '' : `?since=${Math.max(0, S.since - 600000)}`);
    changed += mergeRows(pull, null);
    if (full) queueMissing(pull);
    S.since = +pull.now || S.since;
    const keys = Object.keys(S.pend);
    for (let i = 0; i < keys.length; i += 500) {
      const sent = {}, body = { entries: [], kv: [] };
      for (const k of keys.slice(i, i + 500)) {
        const v = itemOf(k), item = { updated_at: (sent[k] = S.u[k] || 0) };
        if (v === undefined) item.deleted = true; else item.data = v;
        if (k.startsWith('e:')) body.entries.push(Object.assign({ day: k.slice(2) }, item));
        else body.kv.push(Object.assign({ key: k.slice(2) }, item));

  } catch (err) {
    if (err.auth) lsSet(SYNC_KEY, JSON.stringify(Object.assign(syncCfg(), { passcode: '' }))); // wrong passcode: ask again
    SYNC.state = err.offline ? 'offline' : err.auth ? 'auth' : 'error'; SYNC.msg = err.message;
  } finally {

  }

}
async function syncConnect() {

  if (!lsSet(SYNC_KEY, JSON.stringify(Object.assign(syncCfg(), { passcode: pass })))) { toast('⚠️ Could not save the passcode on this device'); return; }
  if (el) el.blur();

function agoText(ms) {

// ===== 5. DERIVED: pace track, goal, weekly stats =====
function trackForResult(cp, sec) { for (const id of ['3:30', '3:45', '4:00']) if (sec <= cp.cuts[id]) return id; return 'behind'; }
// Latest checkpoint result picks the track (5K -> 10K -> Half), unless the user pinned one.
function trackInfo() {
  let auto = { id: '4:00', from: null, behind: false };
  for (const cp of CHECKPOINTS) {
    const r = DB.checkpoints[cp.id];
    if (r && r.sec > 0) { const t = trackForResult(cp, r.sec); auto = { id: t === 'behind' ? '4:00' : t, from: cp, behind: t === 'behind' }; }
  }
  const pin = DB.settings.track;
  if (pin && pin !== 'auto' && TRACKS[pin]) return Object.assign({}, auto, { id: pin, manual: true, auto });
  return Object.assign({}, auto, { manual: false, auto });
}
function curTrack() { return TRACKS[trackInfo().id]; }
function halfPace(T) { return fmtPace(T.half / 13.1); }
function raceGoal() {
  const ti = trackInfo(), half = DB.checkpoints.half;
  if (!ti.manual && half && half.sec > 0) {
    const t = trackForResult(CP.half, half.sec);
    if (t === 'behind') return { goal: BEHIND.goal, pace: BEHIND.pace, byFeel: true, final: true };
    return { goal: t, pace: TRACKS[t].mp, final: true, track: t };
  }
  const T = TRACKS[ti.id];
  return { goal: T.id, pace: T.mp, final: false, track: T.id, behind: ti.behind, manual: ti.manual };
}

function computeStats() {
  const t = todayISO(), cur = weekNumFor(t);
  const weeks = [];
  const tot = { runs: 0, mi: 0, sec: 0, timedMi: 0, strength: 0, ups: 0, longest: 0, longestIso: null, feel: [], hits: 0, judged: 0, zero: 0 };
  let cum = 0, cumFloor = 0, cumUp = 0;
  for (let w = 1; w <= PLAN_WEEKS; w++) {
    const W = WEEKS[w];
    const s = { w, W, runs: 0, mi: 0, sec: 0, timedMi: 0, strength: 0, ups: 0, longest: 0 };
    for (const d of W.days) {
      const e = DB.entries[d.iso]; if (!e) continue;
      if (isRun(e)) {
        s.runs++; s.mi += e.actualDist;
        if (e.actualTime > 0) { s.sec += e.actualTime * 60; s.timedMi += e.actualDist; }
        if (e.upgrade) s.ups++;
        if (e.actualDist > s.longest) s.longest = e.actualDist;
        if (e.actualDist > tot.longest) { tot.longest = e.actualDist; tot.longestIso = d.iso; }
      }
      if (e.strength) s.strength++;
      if (e.rating) tot.feel.push({ iso: d.iso, v: e.rating, phase: d.phase });
    }
    s.started = W.start <= t; s.over = W.end < t;
    s.hit = s.runs >= W.floorRuns;
    s.status = !s.started ? 'future' : s.hit ? 'hit' : s.over ? 'miss' : 'open';
    s.strOk = W.strengthDays === 0 || s.strength >= W.strengthDays;
    cum += s.mi; cumFloor += W.floorMi; cumUp += W.upMi;
    s.cum = cum; s.cumFloor = cumFloor; s.cumUp = cumUp;
    if (s.over || s.status === 'hit') { tot.judged++; if (s.hit) tot.hits++; }
    if (s.over && W.floorRuns > 0 && s.runs === 0) tot.zero++;
    tot.runs += s.runs; tot.mi += s.mi; tot.sec += s.sec; tot.timedMi += s.timedMi; tot.strength += s.strength; tot.ups += s.ups;
    weeks[w] = s;
  }
  // Floor streak: count back from now; an unfinished current week neither counts nor breaks it.
  let streak = 0;
  for (let w = Math.min(cur, PLAN_WEEKS); w >= 1; w--) {
    const st = weeks[w].status;
    if (st === 'open') continue;
    if (st === 'hit') streak++; else break;
  }
  let best = 0, run = 0;
  for (let w = 1; w <= PLAN_WEEKS; w++) {
    const st = weeks[w].status;
    if (st === 'hit') { run++; best = Math.max(best, run); } else if (st === 'miss') run = 0; else if (st === 'future') break;
  }
  // Strength streak (weeks that schedule strength): 2x done.
  let strStreak = 0;
  for (let w = Math.min(cur, PLAN_WEEKS); w >= 1; w--) {
    const s = weeks[w];
    if (s.W.strengthDays === 0) continue;
    if (!s.over && !s.strOk) continue;
    if (s.strOk) strStreak++; else break;
  }
  const lastWeek = cur >= 2 && cur <= PLAN_WEEKS + 1 ? weeks[Math.min(cur - 1, PLAN_WEEKS)] : null;
  return { t, cur, weeks, tot, streak, best, strStreak, unlocked: streak >= 4, lastWeek,
    lastWeekHit: !!(lastWeek && lastWeek.status === 'hit') };
}

// Which version (floor/upgrade) is shown for a day: session choice, else what was logged.
const STATE = { tab: 'today', view: null, modes: {}, calY: 0, calM: 0, sheet: null, openWeeks: {} };
// Hard lock: upgrades can only be chosen after 4 straight floor weeks (re-locks if the streak breaks).
function upLock() { const S = computeStats(); return { unlocked: S.unlocked, streak: Math.min(4, S.streak) }; }
function upUnlocked() { return upLock().unlocked; }
function modeFor(iso) {
  const d = DAYS[iso]; if (!d || !d.up) return 'floor';
  if (STATE.modes[iso] && (STATE.modes[iso] !== 'upgrade' || upUnlocked())) return STATE.modes[iso];
  const e = getE(iso); return e && e.upgrade ? 'upgrade' : 'floor';
}
function versionFor(d, mode) { return mode === 'upgrade' && d.up ? d.up : d.floor; }
// A logged run without an explicit choice: Mon/Thu runs are the upgrade by definition; on Tue / the week-31
// Saturday the distance decides (closer to the upgrade distance than the floor distance).
function inferUpgrade(iso, mi) {
  const d = DAYS[iso]; if (!d || !d.up || !(mi > 0) || !upUnlocked()) return false;
  if (!d.floor.run) return true;
  return Math.abs(mi - d.up.mi) < Math.abs(mi - d.floor.mi);
}

// Pace guidance from the active track (so a checkpoint result updates every workout).
function paceChips(d, mode, T) {
  const v = versionFor(d, mode), kind = v.kind, desc = `${v.desc || ''} ${kind === 'long' ? d.floor.desc : ''}`;
  const chips = [], add = (k, val, hint) => { if (!chips.some(c => c.k === k)) chips.push({ k, v: val, hint }); };
  const genericCsv = !d.csvPace || /^\d{1,2}:\d{2}[–-]\d{1,2}:\d{2}$/.test(d.csvPace) || /^(See Paces tab|Easy \+ MP segments|—|-)$/i.test(d.csvPace);
  if (kind === 'race') { const g = raceGoal(); add('Goal pace', g.pace, `${g.goal} finish`); return chips; }
  if (kind === 'checkpoint') {
    const cp = CP[d.cp]; add('Race effort', `≤ ${fmtDur(cp.cuts[T.id])}`, `${T.id} track target`);
    add('Pace', fmtPace(cp.cuts[T.id] / cp.mi), 'per mile'); return chips;
  }
  if (!v.run) return chips;
  if (!genericCsv && mode === 'floor' && d.csvPace !== 'Goal MP') add('Pace', d.csvPace, kind === 'shakeout' ? 'very easy' : 'no faster');
  if (/@\s*(goal\s*)?MP\b|goal MP/i.test(desc) || d.csvPace === 'Goal MP') add('MP', T.mp, 'marathon pace');
  if (/@\s*T\b|tempo/i.test(desc)) add('Tempo', T.t);
  if (/@\s*I\b|\bI pace/i.test(desc)) add('Interval', T.i);
  if (/5K effort/i.test(desc)) add('5K effort', T.i, '≈ interval pace');
  if (/half (effort|pace)/i.test(desc)) add('Half pace', halfPace(T), `${fmtDur(T.half)} half`);
  if (kind === 'long') add('Long run', T.lr);
  if ((kind === 'easy' || kind === 'strides') && (genericCsv || mode === 'upgrade')) add('Easy', T.easy, 'talk test');
  if (kind === 'quality') add('Easy', T.easy, 'WU / CD / recoveries');
  if (/strides/i.test(desc) || kind === 'strides') add('Strides', '20 s', 'quick + relaxed');
  if (/hill/i.test(desc)) add('Hills', 'Hard up', 'jog down');
  if (/pickups|surges|1 on/i.test(desc)) add('Pickups', T.t, '≈ tempo feel');
  return chips;
}

function contextRules(d, mode, S) {
  const out = [], v = versionFor(d, mode), winter = isWinter(d.iso);
  if (d.up && d.dow === 1) out.push(['tuesday']);
  if (mode === 'upgrade' && !S.unlocked) out.push(['unlock', 'warn', `Not unlocked yet: ${S.streak}/4 straight floor weeks. Fine now and then, not regularly.`]);
  if (mode === 'upgrade' && S.unlocked && S.lastWeek && !S.lastWeekHit) out.push(['unlock', 'warn', 'Last week’s floor wasn’t done. The rule says floor first this week.']);
  if (v.kind === 'easy' || v.kind === 'strides') out.push(['easy']);
  if (d.strength) out.push(['strength']);
  if (d.up && (d.dow === 0 || d.dow === 3)) out.push(['monthu']);
  if (winter && d.dow === 1 && (d.kind === 'quality' || d.kind === 'strides')) out.push(['winterTue']);
  if (winter && d.dow === 5 && d.kind === 'long') out.push(['winterSat']);
  if (winter && d.dow === 4 && DAYS[addDays(d.iso, 1)] && DAYS[addDays(d.iso, 1)].kind === 'long') out.push(['winterFri']);
  if (d.dow === 6) out.push(['sunday']);
  return out;
}

function alertsHTML(S) {

    out.push(`<div class="rule warn"><span class="ri">☁️</span><div><b>Cloud sync last worked ${esc(agoText(DB.sync.at))}.</b> ${plural(n, 'change')} ${n === 1 ? 'is' : 'are'} only on this device so far. Stats → Cloud sync has details.</div></div>`);
  }
  if (BOOT_NOTES.length && !STATE.bootSeen) out.push(`<div class="rule good"><span class="ri">📦</span><div><b>Welcome to the new block.</b> ${BOOT_NOTES.map(esc).join(' ')} <button class="link" data-act="dismiss-boot">Got it</button></div></div>`);
  // Pain rule: flagged in the last 2 days.
  for (let i = 0; i <= 2; i++) {
    const iso = addDays(t, -i), e = getE(iso);
    if (e && e.pain) {
      const back = addDays(iso, 3);
      out.push(ruleHTML('pain', 'bad', `You flagged sharp pain ${i === 0 ? 'today' : i === 1 ? 'yesterday' : 'on ' + DOW_LONG[dowOf(iso)]}. Stop, take 2 days off, reassess ${back <= t ? 'today' : 'on ' + DOW_LONG[dowOf(back)]}.`));
      break;
    }
  }
  const w = S.cur;

    if (s.W.floorRuns > 0 && s.runs === 0 && dow >= 3) out.push(ruleHTML('floor', 'bad', `Zero runs so far this week, and zero-run weeks are the #1 failure mode. Even one run today keeps the block alive.`));
    const y = addDays(t, -1), yd = DAYS[y];

    if (s.status === 'hit' && S.streak === 4 && s.runs === s.W.floorRuns) out.push(ruleHTML('unlock', 'good', '4 straight floor weeks: upgrades are unlocked. Use them when legs feel good and life allows.'));
  }
  return out.length ? `<div class="alert">${out.join('')}</div>` : '';
}

      lbl += `: St. George plan, ${s.workout}`;
    }
    const walked = d && d.kind === 'walk' && e && e.done;
    const cls = ['cc', iso === t ? 'today' : '', ran || walked ? 'done' : '', miss ? 'miss' : '', key ? 'key' : '', !d && !s ? 'off' : ''].join(' ');

    const x = posPct(m[0]); const row = x - last[0] >= 5 ? 0 : x - last[1] >= 5 ? 1 : 0;
    last[row] = x; return m.concat(row);
  });
}

function exportCSV(scope) {
  const rows = [['Date', 'Plan', 'Week', 'Phase', 'Planned Workout', 'Mode', 'Done', 'Miles Ran', 'Time (min)', 'Pace (/mi)', 'Score', 'Strength', 'Pain', 'Notes', 'Checkpoint']];
  const isos = new Set(Object.keys(DB.entries));
  if (scope !== 'stg') for (const cp of CHECKPOINTS) if (DB.checkpoints[cp.id] && DB.checkpoints[cp.id].sec) isos.add(cp.iso);
  for (const iso of [...isos].sort()) {
    const d = DAYS[iso], s = STG_DAYS[iso], inStg = iso >= STG.start && iso <= STG.end;
    if (scope === 'stg' && !inStg) continue;
    const e = DB.entries[iso] || {};
    let planned = '';
    if (d) { const v = versionFor(d, e.upgrade ? 'upgrade' : 'floor'); planned = `${v.title}${v.run ? ' ' + fmtMi(v.mi) + ' mi' : ''}${v.desc ? ': ' + v.desc : ''}`; }
    else if (s) planned = `${s.workout}${s.mi ? ' ' + fmtMi(s.mi) + ' mi' : ''}`;
    const cpr = d && d.cp && DB.checkpoints[d.cp] && DB.checkpoints[d.cp].sec ? fmtDur(DB.checkpoints[d.cp].sec) : '';
    rows.push([fmtFull(iso), d ? 'UVM 2027' : inStg ? 'St George 2026' : '', d ? d.week : s ? s.week : '', d ? d.phase : s ? s.phase : '',
      planned, d && d.up ? (e.upgrade ? 'Upgrade' : 'Floor') : '', e.done ? 'Y' : 'N', (e.actualDist || 0).toFixed(2),
      e.actualTime ? Math.round(e.actualTime * 100) / 100 : 0, isRun(e) && e.actualTime ? fmtPace(e.actualTime * 60 / e.actualDist) : '',

  const r = TIP.getBoundingClientRect(), vw = window.innerWidth;
  let top = cy - r.height - 14; if (top < 8) top = cy + 18;
  TIP.style.left = `${Math.min(Math.max(8, cx - r.width / 2), vw - r.width - 8)}px`; TIP.style.top = `${top}px`;
}
function chartClear(svg) { svg.querySelectorAll('.mk.hl').forEach(g => g.classList.remove('hl')); hideTip(); }
['pointermove', 'pointerdown'].forEach(t => document.addEventListener(t, ev => {
  const svg = ev.target.closest && ev.target.closest('svg[data-chart]'); if (!svg) return;
  chartShow(svg, chartIndex(svg, ev.clientX), ev.clientX, ev.clientY);
}));
document.addEventListener('pointerout', ev => {
  const svg = ev.target.closest && ev.target.closest('svg[data-chart]');
  if (svg && ev.pointerType !== 'touch' && !(ev.relatedTarget && svg.contains(ev.relatedTarget))) chartClear(svg);
});
document.addEventListener('keydown', ev => {
  const svg = ev.target.closest && ev.target.closest('svg[data-chart]'); if (!svg) return;
  const m = CHART_META[svg.dataset.chart]; if (!m) return;
  let i = svg.dataset.cur != null ? +svg.dataset.cur : m.start;
  if (ev.key === 'ArrowRight') i = Math.min(m.n - 1, i + 1); else if (ev.key === 'ArrowLeft') i = Math.max(0, i - 1);
  else if (ev.key === 'Home') i = 0; else if (ev.key === 'End') i = m.n - 1; else return;
  ev.preventDefault(); chartShow(svg, i);
});
document.addEventListener('focusin', ev => { const svg = ev.target.closest && ev.target.closest('svg[data-chart]'); if (svg) { const m = CHART_META[svg.dataset.chart]; if (m) chartShow(svg, svg.dataset.cur != null ? +svg.dataset.cur : m.start); } });
document.addEventListener('focusout', ev => { const svg = ev.target.closest && ev.target.closest('svg[data-chart]'); if (svg) chartClear(svg); });

// ===== 16. INIT =====
(function init() {
  applyTheme();
  const t = todayISO();
  STATE.view = clampView(t); STATE.lastDay = t;
  const cd = dateOf(t >= RANGE_START && t <= '2027-06-30' ? t : t < RANGE_START ? RANGE_START : '2027-06-05');
  STATE.calY = cd.getFullYear(); STATE.calM = cd.getMonth();
  $('#import-file').addEventListener('change', e => handleImportFile(e.target));
  $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
  window.addEventListener('storage', e => {
    if (e.key === STORE_KEY) { DB = loadDB(); snapshot(); applyTheme(); refresh(); } else if (e.key === SYNC_KEY) refresh();
  });
  window.addEventListener('online', () => syncNow());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (Object.keys(DB.sync.pend).length) syncNow(); return; }
    const now = todayISO();
    if (now !== STATE.lastDay) { if (STATE.view === STATE.lastDay) STATE.view = clampView(now); STATE.lastDay = now; }
    refresh(true);
    if (Date.now() - DB.sync.at > 60000) syncNow();
  });
  refresh();
  setTimeout(() => syncNow(), 800);
})();
</script>
